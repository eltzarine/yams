/* ---------- invitations (« Déjà joué avec ») ----------
   invitations/{uid de l'invité} = {code, hote, hoteUid, at}. L'invité a 2 minutes pour accepter (ou refuser). */
const INV_MS=120000;
function pendCount(){const P=S.pending||{};return Object.keys(P).length}
function pendLeft(k){const p=(S.pending||{})[k];return p?Math.max(0,Math.ceil((p.until-Date.now())/1000)):0}
function pendLabel(n){if(((S.pending||{})[pkey(n)]||{}).re)return"en attente";const t=pendLeft(pkey(n));return`en attente ${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`}
function ensureCodeOn(){if(S.live)return;S.live=newCode();S.joins={};S.liveOff=false;persist();pushLive(true);watchJoins()}
async function sendInvite(n,btn){
  const me=typeof meName==="function"?meName():null;
  if(!DB||!me){toast("Connecte-toi pour inviter un joueur.");return}
  if(S.players.some(x=>pkey(x)===pkey(n)))return;
  if(S.players.filter(x=>String(x).trim()).length>=12){toast("La table est pleine (12 joueurs).");return}
  if(btn){btn.disabled=true}
  try{
    let uid=MATE_UID[n];
    if(!uid){const q=await DB.collection("joueurs").where("pseudo","==",n).get();uid=q.docs[0]&&q.docs[0].id}
    if(!uid)throw 0;
    ensureCodeOn();
    await DB.collection("invitations").doc(uid).set({code:S.live,hote:me,hoteUid:Acc.user.uid,at:firebase.firestore.FieldValue.serverTimestamp(),expireAt:expireIn(6e5)});
    S.pending=S.pending||{};S.pending[pkey(n)]={uid,n,until:Date.now()+INV_MS,code:S.live};
    const e=S.players.findIndex(x=>!String(x).trim());if(e>=0)S.players[e]=n;else S.players.push(n);
    watchInvSent(pkey(n));save();render();toast(`Invitation envoyée à ${n}`);
    if(window.gtag)gtag("event","invitation_envoyee");
  }catch(e){if(btn)btn.disabled=false;toast(`Impossible d'inviter ${n} pour le moment.`)}
}
const invWatch={};
function stopInvWatch(k){if(invWatch[k]){invWatch[k]();delete invWatch[k]}}
function watchInvSent(k){
  const p=(S.pending||{})[k];if(!p||!DB||invWatch[k])return;
  invWatch[k]=DB.collection("invitations").doc(p.uid).onSnapshot(d=>{const x=d.exists?d.data():null;if(x&&x.refus)endInvite(k,"a refusé l'invitation")},()=>{});
}
/* fin d'une invitation sans réponse positive : la ligne disparaît */
function endInvite(k,why){
  const p=(S.pending||{})[k];if(!p)return;
  stopInvWatch(k);delete S.pending[k];
  const jid=joinOf(p.n);if(jid)Object.assign(S.joins[jid],{off:true,exp:true,reinv:false}); // pourra revenir en rejoignant à nouveau
  const i=S.players.findIndex(x=>pkey(x)===k);
  if(i>=0){if(S.players.length>1)S.players.splice(i,1);else S.players=[""]}
  if(DB&&p.uid)DB.collection("invitations").doc(p.uid).get().then(d=>{const x=d.exists?d.data():null;if(x&&x.hoteUid===(Acc.user&&Acc.user.uid))d.ref.delete().catch(()=>{})}).catch(()=>{});
  save();if(!S.started&&!VIEW)render();if(why)toast(`${p.n} ${why}`);
}
function cancelInvite(k){endInvite(k,"")}
/* partie quittée : chaque joueur qui avait rejoint reçoit une invitation pour la suivante (5 min, bloque « Commencer ») */
const REINV_MS=5*60e3;
function reinvite(id,j){
  const k=pkey(j.n),acct=!!j.acct&&!/^g/.test(id);j.reinv=true;
  S.pending=S.pending||{};S.pending[k]={uid:acct?id:null,n:j.n,until:Date.now()+REINV_MS,code:S.live,re:true};
  const me=typeof meName==="function"?meName():null;
  if(acct&&DB&&S.live&&me&&Acc.user){
    DB.collection("invitations").doc(id).set({code:S.live,hote:me,hoteUid:Acc.user.uid,at:firebase.firestore.FieldValue.serverTimestamp(),expireAt:expireIn(6e5)}).catch(()=>{});
    watchInvSent(k)}
}
function pendTick(){
  if(VIEW||!pendCount())return;
  let ended=false;
  for(const k of Object.keys(S.pending)){if(Date.now()>=S.pending[k].until){endInvite(k,"n'a pas répondu");ended=true}}
  if(ended)return;
  document.querySelectorAll("[data-pend]").forEach(el=>{const p=S.pending[el.dataset.pend];if(p)el.textContent=pendLabel(p.n)});
}
setInterval(pendTick,1000);
/* côté invité : invitation reçue */
let INV=null,invUnsub=null,invUid=null,invT=0;
function invFresh(){return INV&&INV.code&&Date.now()-INV.ms<REINV_MS}
function watchMyInvite(){
  const uid=Acc.user&&Acc.pseudo?Acc.user.uid:null;
  if(uid===invUid)return;
  if(invUnsub){invUnsub();invUnsub=null}
  invUid=uid;INV=null;
  if(!uid||!DB||VIEW)return;
  invUnsub=DB.collection("invitations").doc(uid).onSnapshot(d=>{
    const x=d.exists?d.data():null;
    const ms=x&&x.at&&typeof x.at.toMillis==="function"?x.at.toMillis():Date.now();
    INV=x&&!x.refus&&typeof x.code==="string"?{code:x.code,hote:String(x.hote||"").slice(0,16),ms:Math.min(ms,Date.now())}:null;
    clearTimeout(invT);if(invFresh())invT=setTimeout(refreshInvite,REINV_MS-(Date.now()-INV.ms)+200);
    refreshInvite();
  },()=>{invUnsub=null;invUid=null});
}
function inviteHTML(){
  if(!invFresh())return`<div id="invbox" hidden></div>`;

    ALL.forEach(k=>{if(r[k]!=null&&Number.isFinite(+r[k]))o[k]=Math.max(0,Math.min(500,Math.round(+r[k])))});scores[p]=o}});

function watchLive(){

/* ================= Appli installable + bandeau de mise à jour (même brique que Midheim) =================
   La nouvelle version se télécharge en arrière-plan puis attend : le bandeau « Mettre à jour » apparaît
   sur tous les écrans (accueil, feuille, spectateur, panneaux). Inactif sans manifeste (version claude.ai) ou hors HTTPS. */
const Pwa={on:false,waiting:null,reg:null,clicked:false,reloading:false,lastCheck:0,
  init(){
    this.on=!!document.querySelector('link[rel="manifest"]')&&("serviceWorker" in navigator)&&window.isSecureContext;
    if(!this.on)return;
    if(VIEW)document.getElementById("updTxt").innerHTML="<b>Nouvelle version disponible.</b>Tu retrouves la partie juste après.";
    navigator.serviceWorker.register("sw.js",{scope:"./",updateViaCache:"none"}).then(reg=>{
      this.reg=reg;
      if(reg.waiting&&navigator.serviceWorker.controller)this.offer(reg.waiting);
      this.track(reg.installing);
      reg.addEventListener("updatefound",()=>this.track(reg.installing));
      this.lastCheck=Date.now();
      setInterval(()=>this.check(),10*60000);
    }).catch(()=>{/* sans service worker, l'appli marche quand même */});
    /* retour sur l'appli (onglet réactivé, téléphone déverrouillé, réseau revenu) : on vérifie tout de suite */
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")this.check()});
    addEventListener("online",()=>this.check());
    addEventListener("pageshow",e=>{if(e.persisted)this.check()});
    document.getElementById("updateBtn").addEventListener("click",()=>this.apply());
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(this.clicked)this.reload()});
  },
  /* « Mettre à jour » : on enregistre la partie, on active la nouvelle version puis on recharge */
  apply(){const btn=document.getElementById("updateBtn");
    if(this.clicked)return;this.clicked=true;btn.setAttribute("aria-busy","true");btn.textContent="Mise à jour…";
    if(window.gtag)gtag("event","mise_a_jour");
    if(typeof persist==="function")persist();
    if(!this.waiting||this.waiting.state!=="installed"){this.reload();return} // déjà activée depuis un autre onglet
    this.waiting.postMessage({type:"SKIP_WAITING"});
    setTimeout(()=>this.reload(),4000)},
  reload(){if(this.reloading)return;this.reloading=true;location.reload()},
  offer(sw){this.waiting=sw;const b=document.getElementById("updateBanner");
    if(b.hidden){b.hidden=false;document.documentElement.classList.add("has-update")}},
  /* suit un service worker en cours d'installation jusqu'à ce qu'il attende son tour */
  track(sw){if(!sw)return;const done=()=>{if(sw.state==="installed"&&navigator.serviceWorker.controller)this.offer(sw)};done();sw.addEventListener("statechange",done)},
  /* cherche une nouvelle version (au plus une fois par minute) */
  check(force){if(!this.reg||!navigator.onLine||(!force&&Date.now()-this.lastCheck<60000))return Promise.resolve();
    this.lastCheck=Date.now();return this.reg.update().catch(()=>{})}
};
Pwa.init();

  /* bouton Face ID toujours proposé si le téléphone sait le faire : la clé peut exister même si ce téléphone l'a oubliée,
     et ce nouveau toucher ouvre Face ID à coup sûr (demande préparée dès l'ouverture du volet) */
  if(PK_OK)prefetchBio(true);
  openSheet(`${CLOSE}<h3 id="sheetTitle">Avant de jouer</h3>
    <div class="sub">Avec un compte, tes scores comptent pour ton palmarès et la saison. Pas de mot de passe.</div>
    <div class="acc"><p class="accerr" role="alert" ${bioWhy?"":"hidden"}>${bioWhy}</p>
      ${PK_OK?`<button class="primary" id="pcBio">Me connecter avec ${BIO_T}</button>`:""}
      <button class="${PK_OK?"secondary":"primary"}" id="pcMail">Recevoir un code par e-mail</button>
      <button class="replay" id="pcGuest">Jouer en invité</button>
    </div>`,
  sh=>{sh.querySelector("#pcMail").onclick=()=>accEmail();const pb=sh.querySelector("#pcBio");if(pb)pb.onclick=()=>bioLogin(pb,sh);
    sh.querySelector("#pcGuest").onclick=()=>{closeSheet();if(window.splashGo)splashGo()}});
}
async function bioBeforePlay(btn){
  if(!ACC_ON||!Acc.ready||!PK_OK||!pkHere()||Acc.user||bioBusy)return;
  bioBusy=true;if(btn){btn.disabled=true;btn.dataset.t=btn.innerHTML;btn.textContent=BIO_T+"…"}
  try{const r=await bioAuth();if(r.pseudo)toast(`Salut ${r.pseudo} 🎲`)}
  catch(err){if(err&&err.code==="passkey_inconnue")setPkHere(false);
    bioWhy=bioCancel(err)?`${BIO_T} annulé ou bloqué. Réessaie avec le bouton ci-dessous.`:`${BIO_T} n’a pas pu s’ouvrir (${(err&&(err.code||err.name))||"erreur"}). Réessaie avec le bouton ci-dessous.`}
  finally{bioBusy=false;if(btn){btn.disabled=false;if(btn.dataset.t)btn.innerHTML=btn.dataset.t}}
}
const bioCancel=err=>err&&(err.name==="NotAllowedError"||err.name==="AbortError");
async function bioLogin(btn,sh){
  busy(btn,true,"Un instant…");setErr(sh,"");
  try{const r=await bioAuth();if(!r.pseudo)accPseudo();else afterLogin()}
  catch(err){busy(btn,false);if(bioCancel(err))return;if(err&&err.code==="passkey_inconnue")setPkHere(false);
    setErr(sh,errMsg(err&&err.code?err:{code:"passkey"}))}
}
/* bouton compte (pastille / initiale) : si Face ID existe sur cet appareil, on lance directement la reconnaissance */
let bioBusy=false;
async function accTap(){
  if(Acc.user||!PK_OK||!pkHere())return openAccount();
  if(bioBusy)return;bioBusy=true;
  try{const r=await bioAuth();if(!r.pseudo)accPseudo();else afterLogin()}
  catch(err){if(err&&err.code==="passkey_inconnue")setPkHere(false);openAccount();
    if(!bioCancel(err)){const sh=document.getElementById("sheet");setErr(sh,errMsg(err&&err.code?err:{code:"passkey"}))}}
  finally{bioBusy=false}
}
/* action à reprendre après la connexion (ex. « Jouer l'histoire ») : oubliée si le volet est fermé sans se connecter */
let loginNext=null;
window.loginThen=fn=>{loginNext={fn,at:Date.now()}};
function takeLoginNext(){const n=loginNext;loginNext=null;return n&&Date.now()-n.at<30*60e3?n.fn:null}
function afterLogin(){const next=takeLoginNext();closeSheet();toast(`Content de te revoir, ${Acc.pseudo} 🎲`);if(window.splashGo)splashGo();if(next)setTimeout(next,0)}

function accWelcome(){
  openSheet(`<div class="acc welcome"><div class="wdice" aria-hidden="true">🎲</div>
    <h3 id="sheetTitle">Bienvenue, ${esc(Acc.pseudo)}</h3>
    <div class="sub">Ton compte est prêt. Tes prochaines parties compteront pour ton palmarès.${PK_OK?` Tu pourras activer ${BIO_T} dans « Mon compte ».`:""}</div>
    <button class="primary" id="accPlay">Jouer</button></div>`,
  sh=>{sh.querySelector("#accPlay").onclick=()=>{const next=takeLoginNext();closeSheet();if(next){if(window.splashGo)splashGo();return next()}const b=document.getElementById("btnPlay");if(b&&b.isConnected)b.click()}});
}

function accSignedIn(){
  openSheet(`${CLOSE}<h3 id="sheetTitle">${esc(Acc.pseudo)}</h3>
    <div class="sub">${Acc.email?esc(Acc.email):"Connecté"}</div>
    <div class="acc">
      <div class="accrow"><span>${BIO_ICON}${BIO_T}</span>${!PK_OK?`<small>non disponible ici</small>`:Acc.passkeys?`<small class="on">✓ activé</small>`:`<button class="ghost" id="accBioOn">Activer</button>`}</div>
      <button class="secondary" id="accPriv">Données personnelles</button>
      <button class="secondary" id="accOut">Se déconnecter</button>
      <button class="replay danger" id="accDel">Supprimer mon compte</button>
    </div>`,
  sh=>{const b=sh.querySelector("#accBioOn");if(b)b.onclick=()=>accBioOffer(true);
    sh.querySelector("#accPriv").onclick=()=>openPrivacy(accSignedIn);
    sh.querySelector("#accOut").onclick=async()=>{const a=fbAuth();if(a)await a.signOut().catch(()=>{});closeSheet();toast("Déconnecté. Tu joues en invité.")};
    sh.querySelector("#accDel").onclick=accDelete;
  });
}

function accDelete(){
  openSheet(`${CLOSE}<h3 id="sheetTitle">Supprimer ton compte ?</h3>
    <div class="sub">Ton e-mail, ton pseudo et ${BIO_T} sont effacés définitivement. Les parties déjà jouées restent dans l’historique, sous le nom écrit sur la feuille.</div>
    <div class="acc"><p class="accerr" role="alert" hidden></p>
      <button class="primary dangerbg" id="accYes">Supprimer définitivement</button>
      <button class="secondary" id="accNo">Annuler</button></div>`,
  sh=>{sh.querySelector("#accNo").onclick=accSignedIn;const b=sh.querySelector("#accYes");
    b.onclick=async()=>{busy(b,true,"Suppression…");setErr(sh,"");
      try{const uid=Acc.user.uid;
        if(DB)await DB.collection("joueurs").doc(uid).delete().catch(()=>{});
        const r=await api("/account/delete",{},true);
        try{await fbAuth().signInWithCustomToken(r.token);await fbAuth().currentUser.delete()}catch(e){await fbAuth().signOut().catch(()=>{})}
        setPkHere(false);ev("compte_supprime");closeSheet();toast("Compte supprimé.")}
      catch(err){busy(b,false);setErr(sh,errMsg(err))}
    };
  });
}

function openPrivacy(back){
  openSheet(`${CLOSE}<h3 id="sheetTitle">Données personnelles</h3>
    <div class="priv">
      <p><b>Ce qu’on garde.</b> Ton adresse e-mail (pour t’envoyer les codes), ton pseudo et, si tu l’actives, la clé publique de ${BIO_T}. Ton visage et ton empreinte ne quittent jamais ton téléphone.</p>
      <p><b>Qui les voit.</b> Ton pseudo est visible des autres joueurs. Ton e-mail reste privé : il n’est ni affiché, ni partagé, ni revendu.</p>
      <p><b>Où.</b> Les e-mails et clés sont stockés chez Cloudflare, les e-mails partent par Brevo, le pseudo et les parties sont chez Google Firebase. Des statistiques de visite anonymes passent par Google Analytics.</p>
      <p><b>Combien de temps.</b> Tant que ton compte existe. Les codes sont effacés au bout de 15 minutes.</p>
      <p><b>Tes droits.</b> Tu peux supprimer ton compte à tout moment depuis « Mon compte ».${window.YAMS_CONTACT?` Pour toute question : ${esc(window.YAMS_CONTACT)}.`:""}</p>
    </div>
    <button class="primary" id="privOk">Compris</button>`,
  sh=>{sh.querySelector("#privOk").onclick=()=>back?back():closeSheet()});
}

/* ---------- démarrage ---------- */
function initAccounts(){
  const a=fbAuth();
  if(!a){Acc.ready=false;acctUI();return}
  a.onAuthStateChanged(async u=>{if(u&&u.isAnonymous)u=null; // identité anonyme (historique) : pas un compte
    Acc.user=u;
    if(!u){Acc.pseudo=null;Acc.email=null;Acc.passkeys=0;Acc.ready=true;acctUI();prefetchBio();return}
    try{const t=await u.getIdTokenResult();Acc.pseudo=t.claims.pseudo||Acc.pseudo||null}catch(e){}
    Acc.ready=true;acctUI();refreshMe();
  });
}
/* Face ID au toucher de « Entrer » : iPhone n'ouvre Face ID que si la demande part tout de suite après le toucher.
   La demande est donc préparée à l'avance et rafraîchie toutes les 2 min tant qu'on est sur l'accueil (on peut y
   jouer aux dés longtemps avant d'entrer). */
setInterval(()=>{const sp=document.getElementById("splash");if(sp&&sp.isConnected&&!sp.classList.contains("hide")&&!document.hidden)prefetchBio()},120e3);
(()=>{const c=document.getElementById("acctChip");if(c)c.onclick=accTap;
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)prefetchBio()});
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>setTimeout(initAccounts,0));else setTimeout(initAccounts,0);})();
</script>
<script>
/* Diagnostic d'affichage : ?diag dans l'adresse, ou 5 tapes rapides sur le logo « Yam’s Club » de l'accueil */
(function(){
  function show(){
    var old=document.getElementById("diagbox");if(old){old.remove();return}
    var m=window.__yamsMesure?window.__yamsMesure():{},de=document.documentElement,
        wrap=document.querySelector(".wrap,#turn,header"),
        sa=(matchMedia("(display-mode: standalone)").matches||navigator.standalone)?"oui":"non",
        vv=window.visualViewport,
        L=[["Version","v32"],["Appli installée",sa],["Page (CSS px)",m.w+" × "+m.h],["Écran (CSS px)",m.sw+" × "+m.sh],
           ["Densité (DPR)",m.dpr],["Largeur physique",m.phys+" px"],["Tactile","coarse="+m.coarse+" · points="+m.touch],
           ["Règle A / B",(m.a?"oui":"non")+" / "+(m.b?"oui":"non")],["Zoom appliqué",de.style.zoom||"aucun"],
           ["Zoom visuel",vv?Math.round(vv.scale*100)/100:"?"],["Largeur contenu",wrap?Math.round(wrap.getBoundingClientRect().width)+" px":"?"],
           ["Navigateur",navigator.userAgent]];
    var b=document.createElement("div");b.id="diagbox";
    b.style.cssText="position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:9999;background:#111;color:#fff;border:2px solid #E8B44A;border-radius:12px;padding:12px 14px;font:13px/1.4 system-ui,sans-serif;word-break:break-word;box-shadow:0 10px 30px rgba(0,0,0,.5)";
    b.innerHTML="<b style='font-size:15px'>Diagnostic affichage</b> <span style='opacity:.7'>(toucher pour fermer)</span><br>"+
      L.map(function(r){return "<span style='opacity:.7'>"+r[0]+" :</span> "+String(r[1]).replace(/</g,"&lt;")}).join("<br>");
    b.onclick=function(){b.remove()};document.body.appendChild(b);
  }
  if(/[?&]diag\b/.test(location.search))addEventListener("load",function(){setTimeout(show,800)});
  var n=0,t=0;
  document.addEventListener("click",function(e){
    if(!e.target.closest||!e.target.closest(".splash .logo"))return;
    var now=Date.now();n=(now-t<600)?n+1:1;t=now;if(n>=5){n=0;show()}
  });
})();
</script>
